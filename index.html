<!doctype html>
<html lang="en">
  <head>
    <!-- Character Encoding & Viewport -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Basic SEO Meta Tags -->
    <title>Flux Virtual - Global Virtual Phone Numbers for SMS & Calls</title>
    <meta
      name="description"
      content="Get virtual phone numbers from 100+ countries for SMS verification, voice calls, and online registrations. Fast activation, secure transactions, trusted by millions."
    />
    <meta
      name="keywords"
      content="virtual phone number, SMS verification, virtual number app, international phone number, voice calls"
    />
    <meta name="author" content="Flux Virtual" />
    <meta name="theme-color" content="#D97757" />

    <!-- Open Graph Meta Tags (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fluxvirtual.com" />
    <meta
      property="og:title"
      content="Flux Virtual - Global Virtual Phone Numbers for SMS & Calls"
    />
    <meta
      property="og:description"
      content="Get virtual phone numbers from 100+ countries for SMS verification, voice calls, and online registrations. Fast activation, secure transactions."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://fluxvirtual.com" />
    <meta
      name="twitter:title"
      content="Flux Virtual - Global Virtual Phone Numbers for SMS & Calls"
    />
    <meta
      name="twitter:description"
      content="Get virtual phone numbers from 100+ countries for SMS verification, voice calls, and online registrations."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:site" content="@FluxVirtual" />
    <meta name="twitter:creator" content="@FluxVirtual" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://fluxvirtual.com" />

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/png" href="/images/flux-logo.png" />
    <link rel="apple-touch-icon" href="/images/flux-logo.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Preconnect to External Resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Google Fonts: Inter -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Additional SEO Meta Tags -->
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    <meta
      name="copyright"
      content="© 2026 Flux Virtual. All rights reserved."
    />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org/",
        "@type": "SoftwareApplication",
        "name": "Flux Virtual",
        "description": "Get virtual phone numbers from 100+ countries for SMS verification, voice calls, and online registrations.",
        "url": "https://fluxvirtual.com",
        "image": "/og-image.png",
        "applicationCategory": "Utilities",
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.8",
          "ratingCount": "1000"
        },
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
